name: weekly-ma

on:
  schedule:
    - cron: "0 12 * * 5"   # 每周五 12:00 UTC，即北京时间 20:00，A 股收盘之后
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: weekly-ma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install baostock
      - run: python scripts/update_ma.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: weekly MA update $(date -u +%F)"
          git pull --rebase origin main
          git push
