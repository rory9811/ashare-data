name: weekly-ma

on:
  schedule:
    # GitHub 的定时任务常常排队晚几个小时，所以排两次：
    - cron: "23 10 * * 5"   # 周五 10:23 UTC = 北京时间周五 18:23
    - cron: "17 19 * * 5"   # 周五 19:17 UTC = 北京时间周六 03:17，补跑；前一次已成功就直接跳过
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: weekly-ma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install baostock
      - run: python scripts/update_ma.py
        env:
          FORCE: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: weekly MA update $(date -u +%F)"
          git pull --rebase origin main
          git push
