name: cn-weekly

on:
  schedule:
    # GitHub 的定时任务常常排队晚几个小时，所以排两次；第二次发现数据已是最新就直接跳过。
    - cron: "23 10 * * 5"   # 周五 10:23 UTC = 北京时间周五 18:23，A 股收盘后
    - cron: "17 19 * * 5"   # 周五 19:17 UTC = 北京时间周六 03:17，补跑
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/common.py", "scripts/update_cn.py", ".github/workflows/cn-weekly.yml"]

permissions:
  contents: write

concurrency:
  group: weekly-ma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install baostock
      - name: Restore last meta (for the skip check)
        run: |
          mkdir -p data/cn
          if git fetch -q --depth 1 origin data-cn; then
            git show FETCH_HEAD:cn/meta.json > data/cn/meta.json || rm -f data/cn/meta.json
          fi
      - run: python scripts/update_cn.py
        env:
          FORCE: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Publish to the data-cn branch
        # 数据只保留最新一份：每次用一个没有历史的新提交覆盖 data-cn 分支，仓库不会越来越大。
        if: hashFiles('data/cn/ma_latest.csv') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/cn"
          cp -r data/cn/. "$tmp/cn/"
          cd "$tmp"
          git init -q -b data-cn
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: cn $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-cn
