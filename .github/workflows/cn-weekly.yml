name: cn-weekly

on:
  schedule:
    # GitHub 的定时任务常常排队晚几个小时，所以排两次；第二次发现数据已是最新就直接跳过。
    - cron: "23 10 * * 5"   # 周五 10:23 UTC = 北京时间周五 18:23，A 股收盘后
    - cron: "17 19 * * 5"   # 周五 19:17 UTC = 北京时间周六 03:17，补跑
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/common.py", "scripts/update_cn.py", ".github/workflows/cn-weekly.yml"]

permissions:
  contents: write

concurrency:
  group: weekly-ma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install baostock
      - run: python scripts/update_cn.py
        env:
          FORCE: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "data: cn $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 15; done
          exit 1
