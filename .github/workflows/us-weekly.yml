name: us-weekly

on:
  schedule:
    # 美股周五收盘是 UTC 20:00（夏令时）或 21:00（冬令时）。排两次，第二次发现数据已是最新就跳过。
    - cron: "13 22 * * 5"   # 周五 22:13 UTC = 北京时间周六 06:13
    - cron: "43 1 * * 6"    # 周六 01:43 UTC = 北京时间周六 09:43，补跑
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/common.py", "scripts/update_us.py", ".github/workflows/us-weekly.yml"]

permissions:
  contents: write

concurrency:
  group: weekly-ma-us
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance
      - name: Restore last meta (for the skip check)
        run: |
          mkdir -p data/us
          if git fetch -q --depth 1 origin data-us; then
            git show FETCH_HEAD:us/meta.json > data/us/meta.json || rm -f data/us/meta.json
          fi
      - run: python scripts/update_us.py
        env:
          FORCE: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Publish to the data-us branch
        # 数据只保留最新一份：每次用一个没有历史的新提交覆盖 data-us 分支，仓库不会越来越大。
        if: hashFiles('data/us/ma_latest.csv') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/us"
          cp -r data/us/. "$tmp/us/"
          cd "$tmp"
          git init -q -b data-us
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: us $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-us
